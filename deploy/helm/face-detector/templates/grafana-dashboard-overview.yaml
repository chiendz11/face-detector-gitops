{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: face-detector-grafana-dashboard
  labels:
    app.kubernetes.io/name: face-detector
    app.kubernetes.io/component: monitoring
    grafana_dashboard: "1"
data:
  face-detector-overview.json: |
    {
      "uid": "face-detector-overview",
      "title": "Face Detector Overview",
      "tags": ["face-detector", "operations"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Backend Request Rate",
          "gridPos": {"h": 6, "w": 6, "x": 0, "y": 0},
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(face_detector_http_requests_total{namespace=\"{{ .Release.Namespace }}\"}[5m]))"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Backend 5xx Rate",
          "gridPos": {"h": 6, "w": 6, "x": 6, "y": 0},
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(face_detector_http_errors_total{namespace=\"{{ .Release.Namespace }}\"}[5m]))"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Backend P95 Latency",
          "gridPos": {"h": 6, "w": 6, "x": 12, "y": 0},
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(face_detector_http_request_duration_seconds_bucket{namespace=\"{{ .Release.Namespace }}\"}[5m])))"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Dependency Health",
          "gridPos": {"h": 6, "w": 6, "x": 18, "y": 0},
          "targets": [
            {
              "refId": "A",
              "expr": "min(face_detector_dependency_health_status{namespace=\"{{ .Release.Namespace }}\"})"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "HTTP Requests By Status",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 6},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status_code) (rate(face_detector_http_requests_total{namespace=\"{{ .Release.Namespace }}\"}[5m]))"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Pod Restarts",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 6},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"{{ .Release.Namespace }}\"}[15m]))"
            }
          ]
        }
      ]
    }
{{- end }}
