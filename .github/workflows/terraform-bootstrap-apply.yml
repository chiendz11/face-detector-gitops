name: Terraform Bootstrap Apply

on:
  workflow_dispatch:
    inputs:
      command:
        description: Run a bootstrap plan or apply.
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
      confirm_apply:
        description: Type apply-bootstrap when command is apply.
        required: false
        type: string
        default: ""
      manage_bootstrap_role:
        description: Manage the approved bootstrap GitHub OIDC role.
        required: true
        type: boolean
        default: true
      attach_bootstrap_policy:
        description: Attach the scoped bootstrap permission policy.
        required: true
        type: boolean
        default: true
      manage_sandbox_role:
        description: Manage the legacy sandbox GitHub OIDC role trust.
        required: true
        type: boolean
        default: false
      manage_sandbox_split_roles:
        description: Manage task-scoped sandbox GitHub OIDC roles.
        required: true
        type: boolean
        default: true
      attach_sandbox_split_policies:
        description: Attach task-scoped sandbox permission policies.
        required: true
        type: boolean
        default: true

run-name: Terraform bootstrap ${{ inputs.command }} by @${{ github.actor }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-bootstrap-apply
  cancel-in-progress: false

jobs:
  bootstrap:
    name: bootstrap
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: bootstrap
    env:
      TF_STATE_REGION: ${{ secrets.TF_STATE_REGION || secrets.AWS_REGION || 'ap-southeast-1' }}
      AWS_REGION: ${{ secrets.TF_STATE_REGION || secrets.AWS_REGION || 'ap-southeast-1' }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve bootstrap settings
        id: settings
        env:
          COMMAND: ${{ inputs.command }}
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AWS_ROLE_BOOTSTRAP_ARN_SECRET: ${{ secrets.AWS_ROLE_BOOTSTRAP_ARN || '' }}
          AWS_ROLE_BOOTSTRAP_ARN_VAR: ${{ vars.AWS_ROLE_BOOTSTRAP_ARN || '' }}
          TF_STATE_BUCKET_SECRET: ${{ secrets.TF_STATE_BUCKET || '' }}
          TF_STATE_BUCKET_VAR: ${{ vars.TF_STATE_BUCKET || '' }}
          TF_STATE_LOCK_TABLE_SECRET: ${{ secrets.TF_STATE_LOCK_TABLE || '' }}
          TF_STATE_LOCK_TABLE_VAR: ${{ vars.TF_STATE_LOCK_TABLE || '' }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "Terraform bootstrap apply must run from the trusted default branch." >&2
            exit 1
          fi

          if [ "${COMMAND}" = "apply" ] && [ "${CONFIRM_APPLY}" != "apply-bootstrap" ]; then
            echo "Set confirm_apply to apply-bootstrap before running bootstrap apply." >&2
            exit 1
          fi

          role_arn="${AWS_ROLE_BOOTSTRAP_ARN_SECRET:-${AWS_ROLE_BOOTSTRAP_ARN_VAR:-}}"
          state_bucket="${TF_STATE_BUCKET_SECRET:-${TF_STATE_BUCKET_VAR:-}}"
          lock_table="${TF_STATE_LOCK_TABLE_SECRET:-${TF_STATE_LOCK_TABLE_VAR:-}}"

          if [ -z "${role_arn}" ]; then
            echo "AWS_ROLE_BOOTSTRAP_ARN must be configured as a GitHub secret or variable." >&2
            exit 1
          fi
          if [ -z "${state_bucket}" ]; then
            echo "TF_STATE_BUCKET must be configured as a GitHub secret or variable." >&2
            exit 1
          fi
          if [ -z "${lock_table}" ]; then
            echo "TF_STATE_LOCK_TABLE must be configured as a GitHub secret or variable." >&2
            exit 1
          fi

          echo "::add-mask::${role_arn}"
          {
            echo "role_arn=${role_arn}"
            echo "state_bucket=${state_bucket}"
            echo "lock_table=${lock_table}"
          } >> "${GITHUB_OUTPUT}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ steps.settings.outputs.role_arn }}
          aws-region: ${{ env.TF_STATE_REGION }}
          role-session-name: gh-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: "1.6.6"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive terraform/bootstrap

      - name: Terraform init
        working-directory: terraform/bootstrap
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ steps.settings.outputs.state_bucket }}" \
            -backend-config="dynamodb_table=${{ steps.settings.outputs.lock_table }}" \
            -backend-config="region=${TF_STATE_REGION}"

      - name: Terraform validate
        working-directory: terraform/bootstrap
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform/bootstrap
        env:
          TF_VAR_aws_region: ${{ env.TF_STATE_REGION }}
          TF_VAR_state_bucket_name: ${{ steps.settings.outputs.state_bucket }}
          TF_VAR_lock_table_name: ${{ steps.settings.outputs.lock_table }}
          TF_VAR_manage_github_oidc_bootstrap_role: ${{ inputs.manage_bootstrap_role }}
          TF_VAR_attach_github_oidc_bootstrap_policy: ${{ inputs.attach_bootstrap_policy }}
          TF_VAR_manage_github_oidc_sandbox_role: ${{ inputs.manage_sandbox_role }}
          TF_VAR_manage_github_oidc_sandbox_split_roles: ${{ inputs.manage_sandbox_split_roles }}
          TF_VAR_attach_github_oidc_sandbox_split_policies: ${{ inputs.attach_sandbox_split_policies }}
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: inputs.command == 'apply'
        working-directory: terraform/bootstrap
        run: terraform apply -auto-approve tfplan
