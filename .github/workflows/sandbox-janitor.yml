name: Sandbox Janitor

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Janitor mode
        required: true
        default: ttl
        type: choice
        options:
          - ttl
          - nightly
      ttl_hours:
        description: Sandbox age threshold used when mode=ttl
        required: false
        default: '48'

permissions:
  contents: read

concurrency:
  group: sandbox-janitor
  cancel-in-progress: false

jobs:
  select-candidates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      candidates: ${{ steps.collect.outputs.candidates }}
      candidate_count: ${{ steps.collect.outputs.candidate_count }}
    env:
      JANITOR_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || (github.event.schedule == '0 15 * * *' && 'nightly' || 'ttl') }}
      TTL_HOURS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ttl_hours || '' }}
      REPO_VARS_JSON: ${{ toJson(vars) }}
    steps:
      - name: Select expired sandbox environments
        id: collect
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const activeLabel = 'sandbox-active';
            const teardownLabel = 'teardown-sandbox';
            const marker = '<!-- sandbox-lifecycle-status -->';
            const mode = process.env.JANITOR_MODE;
            const repoVars = JSON.parse(process.env.REPO_VARS_JSON || '{}');
            const ttlInputRaw = String(process.env.TTL_HOURS || '').trim();
            const ttlRepoVarRaw = String(repoVars.SANDBOX_TTL_HOURS || '').trim();
            const ttlHours = Number(ttlInputRaw || ttlRepoVarRaw || '48');
            if (!Number.isFinite(ttlHours) || ttlHours <= 0) {
              core.setFailed(
                `Invalid sandbox TTL value: dispatch='${ttlInputRaw || '(empty)'}', repoVar='${ttlRepoVarRaw || '(empty)'}'. Expected a positive number.`
              );
              return;
            }
            const now = Date.now();

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });

            const candidates = pulls.filter((pull) => {
              if (pull.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                return false;
              }

              const labels = pull.labels.map((label) => label.name);
              return labels.includes(activeLabel);
            });

            const selected = [];

            for (const pull of candidates) {
              const labels = pull.labels.map((label) => label.name);
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pull.number,
                per_page: 100,
              });

              const lifecycleComment = comments
                .filter((comment) => comment.user.type === 'Bot' && comment.body.includes(marker))
                .sort((left, right) => Date.parse(left.updated_at) - Date.parse(right.updated_at))
                .pop();

              const events = await github.paginate(github.rest.issues.listEvents, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pull.number,
                per_page: 100,
              });
              const activeLabelEvent = events
                .filter((event) => event.event === 'labeled' && event.label?.name === activeLabel)
                .sort((left, right) => Date.parse(left.created_at) - Date.parse(right.created_at))
                .pop();
              const teardownLabelEvent = events
                .filter((event) => event.event === 'labeled' && event.label?.name === teardownLabel)
                .sort((left, right) => Date.parse(left.created_at) - Date.parse(right.created_at))
                .pop();
              const teardownLabelTrusted =
                labels.includes(teardownLabel) &&
                teardownLabelEvent?.actor?.login === context.payload.repository.owner.login &&
                teardownLabelEvent?.actor?.type !== 'Bot';

              const appliedAt = lifecycleComment?.updated_at || activeLabelEvent?.created_at || pull.updated_at || pull.created_at;
              const ageHours = (now - Date.parse(appliedAt)) / 36e5;
              let reason = '';

              if (pull.state !== 'open') {
                reason = 'closed_pr_with_active_sandbox';
              } else if (teardownLabelTrusted) {
                reason = 'explicit_teardown_label';
              } else if (pull.draft) {
                reason = 'draft_pr_with_active_sandbox';
              } else if (ageHours >= ttlHours) {
                reason = `ttl_expired_${ageHours.toFixed(1)}h`;
              }

              if (!reason) {
                if (labels.includes(teardownLabel) && !teardownLabelTrusted) {
                  core.warning(`Ignoring untrusted teardown-sandbox label on PR #${pull.number}; latest label actor was ${teardownLabelEvent?.actor?.login || '(unknown)'}.`);
                }
                core.info(`Skipping PR #${pull.number}; sandbox age ${ageHours.toFixed(1)}h is below the TTL and no trusted teardown signal exists.`);
                continue;
              }

              core.info(`Selecting PR #${pull.number} for sandbox janitor destroy: ${reason}.`);
              selected.push({
                pull_request_number: String(pull.number),
                source_ref_name: pull.head.ref,
                source_git_sha: pull.head.sha,
                owner_login: pull.user.login,
                reason,
              });
            }

            core.setOutput('candidates', JSON.stringify(selected));
            core.setOutput('candidate_count', String(selected.length));
            core.info(`Janitor mode ${mode} selected ${selected.length} sandbox PR(s).`);

  destroy-candidates:
    needs: select-candidates
    if: needs.select-candidates.outputs.candidate_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.select-candidates.outputs.candidates) }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch sandbox destroy workflow
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ matrix.pull_request_number }}
          SOURCE_REF_NAME: ${{ matrix.source_ref_name }}
          SOURCE_GIT_SHA: ${{ matrix.source_git_sha }}
          REASON: ${{ matrix.reason }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'infrastructure.yml',
              ref: context.payload.repository.default_branch,
              inputs: {
                environment: 'sandbox',
                action: 'destroy',
                pull_request_number: process.env.PR_NUMBER,
                source_ref_name: process.env.SOURCE_REF_NAME,
                source_git_sha: process.env.SOURCE_GIT_SHA,
              },
            });

            core.info(`Dispatched sandbox janitor destroy for PR #${process.env.PR_NUMBER}. Reason: ${process.env.REASON}`);
