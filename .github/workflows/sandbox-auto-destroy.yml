name: Sandbox Auto Destroy

on:
  pull_request_target:
    types:
      - closed
      - converted_to_draft
      - unlabeled
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ format('infrastructure-sandbox-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

jobs:
  evaluate-destroy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_destroy: ${{ steps.gate.outputs.should_destroy }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
      source_ref_name: ${{ steps.gate.outputs.source_ref_name }}
      source_git_sha: ${{ steps.gate.outputs.source_git_sha }}
      owner_login: ${{ steps.gate.outputs.owner_login }}
    steps:
      - name: Evaluate sandbox destroy policy
        id: gate
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const payloadLabels = (pr.labels || []).map((label) => label.name);
            let labels = payloadLabels;

            try {
              const { data: livePr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });
              labels = (livePr.labels || []).map((label) => label.name);
              core.info(`Resolved live PR labels: ${labels.join(', ') || '(none)'}`);
            } catch (error) {
              core.warning(`Unable to resolve live PR labels; falling back to event payload: ${error.message}`);
            }

            const sameRepo = pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;
            const trustedActor = context.actor === context.payload.repository.owner.login;
            const hasActiveSandbox = labels.includes('sandbox-active');
            const deployLabels = ['deploy-sandbox', 'deploy-preview'];
            const removedLabel = context.payload.label?.name || '';
            const hasDeployLabel = deployLabels.some((label) => labels.includes(label));
            const removedLastDeployLabel =
              context.payload.action === 'unlabeled' &&
              deployLabels.includes(removedLabel) &&
              !hasDeployLabel;
            const lifecycleRequested = (
              context.payload.action === 'closed' ||
              context.payload.action === 'converted_to_draft' ||
              removedLastDeployLabel
            );
            const shouldDestroy = sameRepo && trustedActor && hasActiveSandbox && lifecycleRequested;

            core.setOutput('should_destroy', shouldDestroy ? 'true' : 'false');
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('source_ref_name', pr.head.ref);
            core.setOutput('source_git_sha', pr.head.sha);
            core.setOutput('owner_login', pr.user.login);

            core.info(`Sandbox destroy decision: should_destroy=${shouldDestroy}, action=${context.payload.action}, actor=${context.actor}, trusted_actor=${trustedActor}, same_repo=${sameRepo}, has_active_sandbox=${hasActiveSandbox}, removed_label=${removedLabel || '(none)'}, has_deploy_label=${hasDeployLabel}, removed_last_deploy_label=${removedLastDeployLabel}`);

            if (!sameRepo) {
              core.info('Skipping sandbox destroy for forked pull requests.');
            } else if (!trustedActor) {
              core.info('Skipping sandbox destroy because the event actor is not the repository owner.');
            } else if (!hasActiveSandbox) {
              core.info('Skipping sandbox destroy because the PR is not marked sandbox-active.');
            } else if (!lifecycleRequested) {
              core.info('Skipping sandbox destroy because no trusted sandbox destroy lifecycle event was detected.');
            }

  destroy-sandbox:
    needs: evaluate-destroy
    if: needs.evaluate-destroy.outputs.should_destroy == 'true'
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/infrastructure.yml
    with:
      environment: sandbox
      action: destroy
      pull_request_number: ${{ needs.evaluate-destroy.outputs.pr_number }}
      source_ref_name: ${{ needs.evaluate-destroy.outputs.source_ref_name }}
      source_git_sha: ${{ needs.evaluate-destroy.outputs.source_git_sha }}
      owner_login: ${{ needs.evaluate-destroy.outputs.owner_login }}
    secrets: inherit
