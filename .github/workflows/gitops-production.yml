name: Promote Production

on:
  repository_dispatch:
    types:
      - promote-production-v1

permissions:
  contents: read

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  promote:
    if: github.event.client_payload.source_repository == 'chiendz11/face-detector-app'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Authenticate application release dispatcher
        env:
          ACTOR: ${{ github.actor }}
          EXPECTED_ACTOR: ${{ vars.APP_RELEASE_BOT_LOGIN || '' }}
        run: |
          test -n "$EXPECTED_ACTOR"
          test "$ACTOR" = "$EXPECTED_ACTOR"

      - name: Mint GitOps automation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.GITOPS_WRITER_APP_ID }}
          private-key: ${{ secrets.GITOPS_WRITER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout desired state
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install promotion dependencies
        run: python -m pip install pyyaml

      - name: Validate versioned promotion payload
        env:
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          IMAGE_TAG: ${{ github.event.client_payload.image_tag }}
          BACKEND_DIGEST: ${{ github.event.client_payload.backend_digest }}
          FRONTEND_DIGEST: ${{ github.event.client_payload.frontend_digest }}
          NGINX_DIGEST: ${{ github.event.client_payload.nginx_digest }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$IMAGE_TAG" = "$SOURCE_SHA"
          for digest in "$BACKEND_DIGEST" "$FRONTEND_DIGEST" "$NGINX_DIGEST"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          done

      - name: Validate and update immutable image locks
        env:
          IMAGE_TAG: ${{ github.event.client_payload.image_tag }}
          BACKEND_DIGEST: ${{ github.event.client_payload.backend_digest }}
          FRONTEND_DIGEST: ${{ github.event.client_payload.frontend_digest }}
          NGINX_DIGEST: ${{ github.event.client_payload.nginx_digest }}
        run: |
          python scripts/update_gitops_image_locks.py \
            --values-file deploy/helm/face-detector/values-production.yaml \
            --image-tag "$IMAGE_TAG" \
            --backend-digest "$BACKEND_DIGEST" \
            --frontend-digest "$FRONTEND_DIGEST" \
            --nginx-digest "$NGINX_DIGEST"

      - name: Open production promotion pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository }}
          RELEASE_TAG: ${{ github.event.client_payload.release_tag }}
        run: |
          short_sha="${SOURCE_SHA:0:12}"
          safe_release=$(echo "$RELEASE_TAG" | tr -c 'A-Za-z0-9._-' '-')
          branch="automation/promote-production-${safe_release:-$short_sha}"
          git config user.name "face-detector-gitops[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add deploy/helm/face-detector/values-production.yaml
          if git diff --cached --quiet; then
            echo "Production already pins $SOURCE_SHA."
            exit 0
          fi
          git commit -m "gitops: promote production ${RELEASE_TAG:-$short_sha}"
          git push --force-with-lease origin "$branch"
          if [ "$(gh pr list --head "$branch" --state open --json number --jq 'length')" = "0" ]; then
            gh pr create \
              --base master \
              --head "$branch" \
              --title "gitops: promote production ${RELEASE_TAG:-$short_sha}" \
              --body "Promote immutable images from ${SOURCE_REPOSITORY}@${SOURCE_SHA}. Production sync remains manual in Argo CD."
          fi
