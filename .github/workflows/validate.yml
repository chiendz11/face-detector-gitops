name: GitOps CI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout desired state
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Lint GitHub Actions workflows
        run: |
          docker run --rm \
            -v "${PWD}:/workdir" \
            -w /workdir \
            rhysd/actionlint:1.7.8

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Validate promotion logic
        run: |
          python -m pip install pyyaml
          python -m unittest \
            scripts.tests.test_update_gitops_image_locks \
            scripts.tests.test_repository_contracts

      - name: Lint owned Helm charts
        run: |
          helm lint deploy/helm/face-detector
          helm lint deploy/helm/platform-applications \
            --set global.repoURL=https://github.com/example/face-detector-gitops.git \
            --set clusterAutoscaler.roleArn=arn:aws:iam::123456789012:role/cluster-autoscaler
          helm lint deploy/helm/platform-resources

      - name: Render staging and production contracts
        env:
          FAKE_DIGEST: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          for environment in staging production; do
            helm template "face-detector-$environment" deploy/helm/face-detector \
              --namespace facedetector \
              -f "deploy/helm/face-detector/values-$environment.yaml" \
              --set backend.image.repository=ghcr.io/example/backend \
              --set backend.image.digest="$FAKE_DIGEST" \
              --set worker.image.repository=ghcr.io/example/backend \
              --set worker.image.digest="$FAKE_DIGEST" \
              --set frontendAdmin.image.repository=ghcr.io/example/admin \
              --set frontendAdmin.image.digest="$FAKE_DIGEST" \
              --set nginx.image.repository=ghcr.io/example/nginx \
              --set nginx.image.digest="$FAKE_DIGEST" > /dev/null
          done

      - name: Render platform Application contracts
        run: |
          for environment in sandbox staging production; do
            automated=true
            if [ "$environment" = production ]; then
              automated=false
            fi

            helm template "face-detector-platform-$environment" deploy/helm/platform-applications \
              --set global.repoURL=https://github.com/example/face-detector-gitops.git \
              --set global.environment="$environment" \
              --set global.environmentIdentity="$environment" \
              --set global.clusterName="face-detector-$environment" \
              --set global.automated="$automated" \
              --set clusterAutoscaler.roleArn=arn:aws:iam::123456789012:role/cluster-autoscaler \
              --set externalDns.enabled=true \
              --set externalDns.baseDomain=face.example.com \
              --set externalDns.provider=cloudflare > /dev/null

            helm template "face-detector-platform-resources-$environment" deploy/helm/platform-resources \
              --set environment="$environment" > /dev/null
          done

      - name: Render pinned upstream platform charts
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm repo add kedacore https://kedacore.github.io/charts
          helm repo add autoscaler https://kubernetes.github.io/autoscaler
          helm repo add external-dns https://kubernetes-sigs.github.io/external-dns/
          helm repo update

          for environment in sandbox staging production; do
            helm template metrics-server metrics-server/metrics-server --version 3.13.0 \
              -f deploy/platform/metrics-server/values-common.yaml \
              -f "deploy/platform/metrics-server/values-$environment.yaml" > /dev/null
            helm template keda kedacore/keda --version 2.19.0 \
              -f deploy/platform/keda/values-common.yaml \
              -f "deploy/platform/keda/values-$environment.yaml" > /dev/null
            helm template cluster-autoscaler autoscaler/cluster-autoscaler --version 9.56.0 \
              -f deploy/platform/cluster-autoscaler/values-common.yaml \
              -f "deploy/platform/cluster-autoscaler/values-$environment.yaml" \
              --set awsRegion=ap-southeast-1 \
              --set autoDiscovery.clusterName="face-detector-$environment" > /dev/null
            helm template external-dns external-dns/external-dns --version 1.15.2 \
              -f deploy/platform/external-dns/values-common.yaml \
              -f "deploy/platform/external-dns/values-$environment.yaml" \
              --set provider.name=cloudflare \
              --set txtOwnerId="face-detector-$environment" \
              --set 'domainFilters[0]=face.example.com' > /dev/null
            helm template monitoring prometheus-community/kube-prometheus-stack --version 85.3.3 \
              -f deploy/platform/kube-prometheus-stack/values-common.yaml \
              -f "deploy/platform/kube-prometheus-stack/values-$environment.yaml" > /dev/null
            helm template loki grafana/loki --version 7.0.0 \
              -f deploy/platform/loki/values-common.yaml \
              -f "deploy/platform/loki/values-$environment.yaml" > /dev/null
            helm template alloy grafana/alloy --version 1.8.2 \
              -f deploy/platform/alloy/values-common.yaml \
              -f "deploy/platform/alloy/values-$environment.yaml" > /dev/null
          done

  gateway:
    runs-on: ubuntu-latest
    needs: validate
    if: always()
    steps:
      - name: Enforce GitOps validation
        env:
          RESULT: ${{ needs.validate.result }}
        run: test "$RESULT" = "success"
