name: GitOps CI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout desired state
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Lint GitHub Actions workflows
        run: |
          docker run --rm \
            -v "${PWD}:/workdir" \
            -w /workdir \
            rhysd/actionlint:1.7.8

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Validate promotion logic
        run: |
          python -m pip install pyyaml
          python -m unittest \
            scripts.tests.test_update_gitops_image_locks \
            scripts.tests.test_repository_contracts

      - name: Lint Helm chart
        run: helm lint deploy/helm/face-detector

      - name: Render staging and production contracts
        env:
          FAKE_DIGEST: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          for environment in staging production; do
            helm template "face-detector-$environment" deploy/helm/face-detector \
              --namespace facedetector \
              -f "deploy/helm/face-detector/values-$environment.yaml" \
              --set backend.image.repository=ghcr.io/example/backend \
              --set backend.image.digest="$FAKE_DIGEST" \
              --set worker.image.repository=ghcr.io/example/backend \
              --set worker.image.digest="$FAKE_DIGEST" \
              --set frontendAdmin.image.repository=ghcr.io/example/admin \
              --set frontendAdmin.image.digest="$FAKE_DIGEST" \
              --set nginx.image.repository=ghcr.io/example/nginx \
              --set nginx.image.digest="$FAKE_DIGEST" > /dev/null
          done

  gateway:
    runs-on: ubuntu-latest
    needs: validate
    if: always()
    steps:
      - name: Enforce GitOps validation
        env:
          RESULT: ${{ needs.validate.result }}
        run: test "$RESULT" = "success"
